# Categoriser eval: day 2.
# Run from the repo root with `make eval`, then `npx promptfoo@latest view` to see results in a browser.
#
# The loop you're learning: change the prompt → run the eval → compare scores → keep or revert.
# Try making categoriser_v2.txt with few-shot examples, list both under `prompts`,
# and promptfoo will compare them side by side.
description: Cardo transaction categoriser

prompts:
  - file://prompts/categoriser_v1.txt
  - file://prompts/categoriser_v2.txt

providers:
  - id: anthropic:messages:claude-haiku-5-5
    config:
      max_tokens: 20

# Generated by `make seed`: one row per unique description, with the right answer.
# Add your own hard cases at the bottom of a copy (e.g. "PAYPAL *STEAMGAMES").
tests:
  - file://../data/labelled.csv
  - file://../data/hard.csv
  - file://../data/hard2.csv
